name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # GitHub ke "Actions" tab se manually bhi chala sakte ho

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Sirf PR builds cancel hoti hain; main par chalti hui release publish beech me nahi rukti.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 36.1 wagairah ke liye AGP SDK components khud download karta hai,
      # bas licenses accept honi chahiye.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # app/build.gradle.kts debug build ke liye ${rootDir}/debug.keystore maangta hai, lekin wo
      # .gitignore me hai. Repo me ek fixed debug keystore (ci/ci-debug.keystore) hai, taaki har
      # build ka signature same rahe aur purani install ke upar update install ho sake.
      - name: Use CI debug keystore
        run: cp ci/ci-debug.keystore debug.keystore

      # Web/phone se upload karne par executable permission chali jaati hai, isliye explicitly set karte hain.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk AniStream.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-debug-apk
          path: AniStream.apk
          if-no-files-found: error
          retention-days: 30

  # Har successful build ke baad APK ek GitHub Release (tag: latest) me daal deta hai.
  # Fixed download link: https://github.com/<owner>/<repo>/releases/latest/download/AniStream.apk
  publish-release:
    name: Publish download link
    needs: build-debug-apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: AniStream-debug-apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest AniStream.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AniStream - latest build" \
            --notes "Debug APK built automatically from commit ${GITHUB_SHA::7}. Install it on Android (allow 'Install unknown apps' when asked)." \
            --latest
            
