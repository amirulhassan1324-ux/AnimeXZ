name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # GitHub ke "Actions" tab se manually bhi chala sakte ho

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Sirf PR builds cancel hoti hain; main par chalti hui release publish beech me nahi rukti.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Ye workflow akeli file ke bharose chalti hai: repo me gradlew / gradle-wrapper.jar na ho
      # tab bhi chalegi. Gradle ka wahi version install hota hai jo
      # gradle/wrapper/gradle-wrapper.properties me hai (9.3.1).
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # compileSdk 36.1 wagairah ke liye AGP SDK components khud download karta hai,
      # bas licenses accept honi chahiye.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

