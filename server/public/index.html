<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeXZ Admin</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f0f14;color:#eee;margin:0;padding:14px;max-width:640px;margin:auto}
  h2{margin:22px 0 8px;font-size:17px;color:#b79cff}
  .card{background:#1a1a24;border-radius:12px;padding:12px;margin-bottom:12px}
  input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #333;background:#101018;color:#fff;font-size:15px}
  button{background:#7c4dff;border:0;font-weight:600}
  button.sec{background:#2a2a3a}
  button.del{background:#b3261e;width:auto;padding:6px 10px;font-size:13px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .url{word-break:break-all;font-size:13px;color:#8be9a8}
  .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2a2a3a;font-size:14px}
  small{color:#999}
</style>
</head>
<body>
<h1 style="font-size:20px">AnimeXZ Admin</h1>

<div class="card">
  <input id="key" type="password" placeholder="Admin Key (ADMIN_KEY)">
  <button id="saveBtn" type="button">Save Key</button>
  <div id="keyStatus"><small>Key daalke Save Key dabao.</small></div>
</div>

<h2>1. File upload (photo / video)</h2>
<div class="card">
  <input id="file" type="file" accept="image/*,video/*,.m3u8,.vtt,.srt">
  <button onclick="upload()">Upload</button>
  <div id="upStatus"><small>Upload ke baad link yahan aayega, copy karke neeche use karo.</small></div>
  <div id="upUrl" class="url"></div>
  <button class="sec" onclick="copyUrl()">Copy Link</button>
</div>

<h2>2. Naya Anime add karo</h2>
<div class="card">
  <input id="a_title" placeholder="Title *">
  <input id="a_cover" placeholder="Poster/Cover URL (upload wala link)">
  <input id="a_banner" placeholder="Banner URL (optional)">
  <div class="row"><input id="a_eps" type="number" placeholder="Total episodes"><input id="a_year" type="number" placeholder="Year"></div>
  <div class="row"><input id="a_score" type="number" step="0.1" placeholder="Score (0-10)"><input id="a_format" placeholder="Format (TV/MOVIE)"></div>
  <input id="a_genres" placeholder="Genres (comma se)">
  <input id="a_studio" placeholder="Studio">
  <textarea id="a_desc" rows="3" placeholder="Description"></textarea>
  <button onclick="addAnime()">Add Anime</button>
</div>

<h2>3. Episode add karo</h2>
<div class="card">
  <input id="e_anime" type="number" placeholder="Anime ID (server ka 1000000+ ya AniList ID)">
  <div class="row"><input id="e_num" type="number" placeholder="Episode no."><input id="e_title" placeholder="Title (optional)"></div>
  <input id="e_url" placeholder="Video stream URL (mp4 / m3u8) *">
  <input id="e_thumb" placeholder="Thumbnail URL (optional)">
  <button class="sec" onclick="useUploaded('e_url')">Last uploaded link ko video URL banao</button>
  <button onclick="addEpisode()">Add / Update Episode</button>
</div>

<h2>Mere Anime</h2>
<div class="card" id="list">Loading...</div>
<h2>Uploaded files</h2>
<div class="card" id="files"></div>

<script>
const $ = (id) => document.getElementById(id);
let memKey = '';
function getKey(){ try { return localStorage.getItem('adminKey') || memKey; } catch { return memKey; } }
function setKey(v){ memKey = v; try { localStorage.setItem('adminKey', v); } catch {} }
$('key').value = getKey();
let lastUrl = '';
const H = () => ({ 'Content-Type': 'application/json', 'x-admin-key': getKey() });
async function saveKey(){
  const v = $('key').value.trim();
  if(!v){ $('keyStatus').innerHTML = '<small style="color:#ff8a80">Pehle Admin Key daalo</small>'; return; }
  setKey(v);
  $('keyStatus').innerHTML = '<small>Check ho raha hai...</small>';
  try {
    await api('/api/files',{headers:H()});
    $('keyStatus').innerHTML = '<small style="color:#8be9a8">Saved ✓ Key sahi hai</small>';
    refresh();
  } catch(e) {
    $('keyStatus').innerHTML = '<small style="color:#ff8a80">Galat key ya server error: '+esc(e.message)+'</small>';
  }
}
$('saveBtn').addEventListener('click', saveKey);
$('key').addEventListener('keydown', e => { if(e.key === 'Enter') saveKey(); });
async function api(path, opt={}) {
  const r = await fetch(path, opt); const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || r.status); return j;
}
function upload(){
  const f = $('file').files[0]; if(!f) return alert('File chuno');
  const fd = new FormData(); fd.append('file', f);
  const x = new XMLHttpRequest(); x.open('POST','/api/upload');
  x.setRequestHeader('x-admin-key', getKey());
  x.upload.onprogress = e => { if(e.lengthComputable) $('upStatus').textContent = 'Uploading ' + Math.round(e.loaded/e.total*100) + '%'; };
  x.onload = () => { let j={}; try{j=JSON.parse(x.responseText)}catch{}
    if(x.status===200){ lastUrl=j.url; $('upStatus').textContent='Done: '+j.name; $('upUrl').textContent=j.url; refresh(); }
    else $('upStatus').textContent='Error: '+(j.error||x.status); };
  x.onerror = () => $('upStatus').textContent='Network error';
  x.send(fd);
}
function copyUrl(){ if(lastUrl){ navigator.clipboard.writeText(lastUrl); alert('Copied'); } }
function useUploaded(id){ if(lastUrl) $(id).value = lastUrl; else alert('Pehle file upload karo'); }
async function addAnime(){
  try{
    const j = await api('/api/anime',{method:'POST',headers:H(),body:JSON.stringify({
      title:$('a_title').value, coverImage:$('a_cover').value, bannerImage:$('a_banner').value,
      episodes:$('a_eps').value, seasonYear:$('a_year').value, averageScore:$('a_score').value,
      format:$('a_format').value, genres:$('a_genres').value, studio:$('a_studio').value, description:$('a_desc').value })});
    alert('Anime ID: '+j.id); $('e_anime').value=j.id; refresh();
  }catch(e){ alert(e.message); }
}
async function addEpisode(){
  try{
    await api('/api/anime/'+$('e_anime').value+'/episodes',{method:'POST',headers:H(),body:JSON.stringify({
      number:$('e_num').value, title:$('e_title').value, videoUrl:$('e_url').value, thumbnail:$('e_thumb').value })});
    alert('Episode saved'); $('e_num').value=''; $('e_url').value='';
  }catch(e){ alert(e.message); }
}
async function delAnime(id){ if(!confirm('Delete?')) return; await api('/api/anime/'+id,{method:'DELETE',headers:H()}); refresh(); }
async function delFile(id){ if(!confirm('Delete file?')) return; await api('/api/files/'+id,{method:'DELETE',headers:H()}); refresh(); }
async function refresh(){
  try{
    const a = await api('/api/anime');
    $('list').innerHTML = a.length ? a.map(x=>`<div class="item"><span>${esc(x.title)}<br><small>ID ${x.id}</small></span><button class="del" onclick="delAnime(${x.id})">Delete</button></div>`).join('') : '<small>Abhi koi anime nahi</small>';
    const f = await api('/api/files',{headers:H()});
    $('files').innerHTML = f.length ? f.map(x=>`<div class="item"><span>${esc(x.name)}<br><small class="url">${x.url}</small></span><button class="del" onclick="delFile('${x.id}')">Del</button></div>`).join('') : '<small>Koi file nahi</small>';
  }catch(e){ $('files').innerHTML = '<small>'+esc(e.message)+'</small>'; }
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
refresh();
</script>
</body>
</html>
